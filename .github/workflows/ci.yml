name: Public CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest==9.0.3 jsonschema==4.25.1 numpy==2.4.4 matplotlib==3.11.1 pyyaml==6.0.3
      - run: python tools/stage_c_release.py verify-code --root .
      - run: python -m pytest -q
